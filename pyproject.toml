[project]
name = "marilia-datahub"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pandas>=2.2,<4",
  "openpyxl>=3.1,<4",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.18,<1",
  "python-dotenv>=1,<2",
  "rapidfuzz>=3,<4",
  "psycopg[binary,pool]>=3.2,<4",
  "numpy>=1.26,<3",
  "onnxruntime>=1.20,<2",
  "tokenizers>=0.21,<1",
]

[tool.vercel]
entrypoint = "app.main:app"
