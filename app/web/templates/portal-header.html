<!doctype html><html lang="pt-BR" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assistência Social · Portal de Dados Abertos</title><style>
:root{--bg:#fafafa;--card:#fff;--fg:#0a0a0a;--mut:#71717a;--bd:#e4e4e7;--mu:#f4f4f5;--pri:#4f46e5;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--r:12px;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#09090b;--card:#111113;--fg:#fafafa;--mut:#a1a1aa;--bd:#27272a;--mu:#1b1b1e;--pri:#818cf8;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#09090b;--card:#111113;--fg:#fafafa;--mut:#a1a1aa;--bd:#27272a;--mu:#1b1b1e;--pri:#818cf8;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 'Geist',Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.mono{font-family:'Geist Mono',ui-monospace,monospace;font-size:13px}
.ic{width:16px;height:16px;flex:none}
.app{display:flex;min-height:100%}
.side{width:248px;flex:none;background:var(--card);border-right:1px solid var(--bd);padding:14px 10px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;align-self:flex-start;overflow-y:auto;transition:margin .2s}
.app.min .side{margin-left:-248px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.logo{width:32px;height:32px;border-radius:9px;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.brand b{display:block;line-height:1.1}.brand small{color:var(--mut);font-size:11.5px}
.grp{color:var(--mut);font-size:12px;font-weight:500;padding:14px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--mut);font:inherit;font-weight:500;padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left}
.nav:hover{background:var(--mu);color:var(--fg)}
.nav.on{background:var(--mu);color:var(--fg)}
.nav.on .ic{color:var(--pri)}
.sfoot{margin-top:18px;padding:12px;border:1px solid var(--bd);border-radius:10px;font-size:12.5px;color:var(--mut)}
.sfoot b{color:var(--fg);display:block;margin-bottom:2px}
.main{flex:1;min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;height:56px;padding:0 20px;background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd)}
.crumb{color:var(--mut);display:flex;gap:8px;align-items:center;min-width:0;white-space:nowrap}.crumb b{color:var(--fg);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.ib{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:8px;cursor:pointer}
.ib:hover{background:var(--mu)}
select,.sel{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;height:34px;max-width:100%}
.me{display:flex;align-items:center;gap:8px}
.av{width:30px;height:30px;border-radius:50%;background:var(--mu);border:1px solid var(--bd);display:grid;place-items:center;font-weight:600;font-size:12px}
.page{padding:24px;max-width:1280px;margin:0 auto}
h1{font-size:24px;letter-spacing:-.02em;margin:0;font-weight:600}
.sub{color:var(--mut);margin:2px 0 0}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:0 1px 2px #0000000d}
.kpi{padding:18px}
.kpi .l{display:flex;justify-content:space-between;color:var(--mut);font-weight:500}
.kpi .v{font-size:30px;font-weight:600;letter-spacing:-.02em;margin:6px 0 4px}
.kpi .n{color:var(--mut);font-size:12.5px;display:flex;gap:6px;align-items:center}
.cp{padding:18px}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.ch h3{margin:0;font-size:15px;font-weight:600}.ch p{margin:2px 0 0;color:var(--mut);font-size:13px}
.g2{display:grid;grid-template-columns:3fr 2fr;gap:16px;margin-bottom:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.sc{padding:16px;text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%}
.sc:hover{border-color:var(--pri)}
.sc.lock{cursor:default;opacity:.7}.sc.lock:hover{border-color:var(--bd)}
.sc h4{margin:0;font-size:14.5px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.sc small{color:var(--mut)}
.num{font-size:26px;font-weight:600;letter-spacing:-.02em;margin:8px 0 6px}
.bar{height:6px;border-radius:99px;background:var(--mu);overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:var(--pri)}
.b{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:2px 9px;border-radius:99px;border:1px solid var(--bd);color:var(--mut);white-space:nowrap}
.b.ok{color:var(--ok);background:color-mix(in oklab,var(--ok) 13%,transparent);border-color:transparent}
.b.warn{color:var(--warn);background:color-mix(in oklab,var(--warn) 13%,transparent);border-color:transparent}
.b.bad{color:var(--bad);background:color-mix(in oklab,var(--bad) 13%,transparent);border-color:transparent}
.b.pri{color:var(--pri);background:color-mix(in oklab,var(--pri) 13%,transparent);border-color:transparent}
.fill-ok{background:var(--ok)!important}.fill-warn{background:var(--warn)!important}.fill-bad{background:var(--bad)!important}
.btn{font:inherit;font-weight:500;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:8px;padding:5px 12px;height:32px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--mu)}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}.btn.p:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.bad{color:var(--bad)}
.note{display:flex;gap:10px;align-items:center;padding:10px 14px;border:1px solid var(--bd);background:var(--mu);border-radius:10px;color:var(--mut);margin-bottom:16px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--mut);font-weight:500;padding:9px 12px;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--bd);vertical-align:middle}
tr:last-child td{border-bottom:0}
.m{display:grid;grid-template-columns:130px 1fr 36px;gap:12px;align-items:center;margin-bottom:12px}
.m span{color:var(--mut)}.m b{text-align:right}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{font:inherit;font-weight:500;border:1px solid var(--bd);background:var(--card);color:var(--mut);border-radius:99px;padding:4px 14px;cursor:pointer}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{padding:9px 14px;border-radius:9px;border:1px solid var(--bd);border-left-width:4px;background:var(--card);font-weight:500}
.tile small{color:var(--mut);margin-left:8px}
.lg{display:flex;gap:16px;color:var(--mut);margin-top:16px;flex-wrap:wrap}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.form{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--bd)}.row:last-child{border-bottom:0}
.row b{display:block}.row small{color:var(--mut)}
.chart{width:100%;height:auto;display:block}
.toast{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:50;font-weight:500;max-width:calc(100% - 40px)}
@media(max-width:860px){
.side{position:fixed;top:0;left:0;bottom:0;height:auto;margin-left:-260px;z-index:40;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.app.min .side{margin-left:-260px}.app.open .side,.app.open.min .side{margin-left:0;box-shadow:0 0 40px #0006}
.kpis{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}.page{padding:16px}.me span{display:none}
}
@media(max-width:480px){.kpis{grid-template-columns:1fr}.m{grid-template-columns:100px 1fr 32px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.portal-top{background:#fff;border-bottom:1px solid var(--bd);padding:18px max(24px,calc((100vw - 1160px)/2));display:flex;gap:12px;align-items:center}.portal{max-width:1160px;margin:auto;padding:28px 24px}.hero{background:linear-gradient(125deg,#312e81,#4f46e5);padding:32px;border-radius:16px;color:white;margin:20px 0}.hero h1{font-size:30px;max-width:720px;margin:14px 0 10px}.hero p{color:#e0e7ff;max-width:760px}.label{font-size:11px;letter-spacing:.1em;font-weight:700}.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px}.layout>*{min-width:0}.metadata dt{color:var(--mut);font-size:12px;margin-top:16px}.metadata dd{margin:3px 0;overflow-wrap:anywhere}.format{display:grid;place-items:center;width:44px;height:44px;background:#eef2ff;color:#4338ca;border-radius:10px;font-weight:700}.res{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--bd)}.res:last-child{border:0}.res small{display:block;color:var(--mut)}a.btn{text-decoration:none}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}.stats .card{padding:16px}.stats strong{font-size:24px;display:block}.foot{text-align:center;margin:28px 0;color:var(--mut);font-size:12px}@media(max-width:780px){.layout{grid-template-columns:1fr}.hero{padding:22px}.hero h1{font-size:25px}.stats{grid-template-columns:1fr}.res{flex-wrap:wrap}}</style></head><body>
